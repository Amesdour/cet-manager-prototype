services:
  - type: web
    name: cet-manager-prototype
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: cet-manager-db
          property: connectionString

databases:
  - name: cet-manager-db
    plan: free
